version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: healthml_postgres
    environment:
      POSTGRES_USER: healthadmin
      POSTGRES_PASSWORD: healthpassword
      POSTGRES_DB: healthml_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthadmin -d healthml_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: healthml_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
